<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>럭키 룰렛</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px; }

    /* 메인 상단 바 (새로고침 좌측 배치, 설정/기록 우측 배치) */
    header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .btn-icon { background: none; border: none; font-size: 26px; cursor: pointer; opacity: 0.8; transition: transform 0.2s; }
    .btn-icon:active { transform: scale(0.9); }

    /* 룰렛 컨테이너 */
    .wheel-area { position: relative; width: 92vw; max-width: 390px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    canvas#wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 32px; height: 38px; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    .pointer::before { content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 36px solid #ef4444; }
    .wheel-center-cap { position: absolute; width: 46px; height: 46px; background: radial-gradient(circle, #f8fafc, #cbd5e1); border-radius: 50%; border: 3px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 5; }

    /* 컨트롤 버튼 */
    .control-area { width: 100%; display: flex; justify-content: center; padding-bottom: 20px; }
    .btn-spin { width: 80%; max-width: 320px; height: 60px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; border: none; border-radius: 30px; font-size: 22px; font-weight: bold; letter-spacing: 2px; cursor: pointer; box-shadow: 0 8px 24px rgba(217, 119, 6, 0.4); transition: transform 0.1s, opacity 0.2s; }
    .btn-spin:active { transform: scale(0.96); }
    .btn-spin:disabled { background: #475569; box-shadow: none; opacity: 0.6; cursor: not-allowed; }

    /* 당첨 팝업 모달 */
    .modal-winner { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-winner.active { opacity: 1; pointer-events: auto; }
    .winner-card { background: #1e293b; border: 2px solid #f59e0b; border-radius: 20px; padding: 30px 24px; text-align: center; width: 85%; max-width: 320px; transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .modal-winner.active .winner-card { transform: scale(1); }
    .winner-subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 8px; }
    .winner-name { font-size: 32px; font-weight: 800; color: #fbbf24; margin-bottom: 24px; word-break: break-all; }
    .btn-confirm { width: 100%; height: 48px; background: #f59e0b; border: none; border-radius: 24px; font-size: 17px; font-weight: bold; color: #ffffff; cursor: pointer; }

    /* 패널 모달 공통 */
    .modal-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; background: #0f172a; z-index: 90; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease-in-out; padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px; box-sizing: border-box; }
    .modal-panel.active { transform: translateY(0); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 16px 0; border-bottom: 1px solid #334155; }
    .panel-header h2 { font-size: 18px; font-weight: 700; text-align: center; flex: 1; }
    .btn-nav { background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background 0.2s, transform 0.1s; }
    .btn-nav:active { transform: scale(0.95); background: #475569; }

    .panel-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 0; width: 100%; box-sizing: border-box; }
    .panel-footer { padding: 12px 0; }
    .panel-group { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; width: 100%; box-sizing: border-box; }
    .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
    
    /* 토글 스위치 */
    .toggle-wrap { display: flex; background: #334155; border-radius: 10px; padding: 5px; }
    .toggle-opt { flex: 1; padding: 14px 12px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: 800; color: #94a3b8; cursor: pointer; transition: background 0.3s, color 0.3s, transform 0.1s; }
    .toggle-opt:active { transform: scale(0.97); }
    #modePlanned.selected { background: #93c5fd; color: #1e3a8a; }
    #modeRandom.selected { background: #f9a8d4; color: #831843; }

    /* 인원수 및 명단 리스트 */
    .slider-row { display: flex; align-items: center; gap: 12px; font-size: 15px; }
    .slider-row input[type="range"] { flex: 1; accent-color: #f59e0b; }
    .item-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; }
    
    /* 입력란 가로폭 초과 방지 스타일 */
    .item-row { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; }
    .btn-badge { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #64748b; background: #334155; color: #94a3b8; font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .btn-badge.active { background: #f59e0b; border-color: #f59e0b; color: #ffffff; }
    
    /* min-width: 0 설정으로 flex 오버플로우 방지 */
    .item-input { flex: 1; min-width: 0; width: 100%; height: 42px; background: #334155; border: 1px solid #475569; border-radius: 8px; padding: 0 10px; color: #ffffff; font-size: 15px; outline: none; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
    .item-input:focus { border-color: #f59e0b; }

    /* 개별 항목 삭제 버튼 */
    .btn-item-del { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #ef4444; background: rgba(239, 68, 68, 0.15); color: #f87171; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, color 0.15s, transform 0.1s; }
    .btn-item-del:active { background: #ef4444; color: #ffffff; transform: scale(0.92); }

    /* 설정 액션 버튼 그룹 (3분할) */
    .reset-btn-group { display: flex; gap: 8px; margin-top: 15px; }
    .btn-small { flex: 1; padding: 12px 6px; border-radius: 10px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; transition: transform 0.1s; white-space: nowrap; }
    .btn-small:active { transform: scale(0.95); }
    #resetNextOrderBtn { background: #bbf7d0; color: #14532d; }
    #clearAllBadgesBtn { background: #fde047; color: #713f12; }
    #clearAllNamesBtn { background: #fee2e2; color: #991b1b; }
    .btn-save { width: 100%; height: 54px; background: #f59e0b; border: none; border-radius: 27px; color: #ffffff; font-size: 18px; font-weight: bold; cursor: pointer; }

    /* 대기 명단 개별 확정/삭제 스타일 */
    .event-input-box { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .event-input-box input { flex: 1; height: 42px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 0 12px; color: #ffffff; font-size: 14px; outline: none; user-select: text; -webkit-user-select: text; }
    .event-input-box input:focus { border-color: #10b981; }

    .record-item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; }
    .record-info { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
    .record-time { color: #94a3b8; font-size: 12px; flex-shrink: 0; }
    .record-name { font-weight: bold; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .record-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-confirm-sm { background: #10b981; color: #ffffff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-confirm-sm:active { background: #059669; transform: scale(0.95); }
    .btn-del-sm { background: #ef4444; color: #ffffff; border: none; border-radius: 6px; padding: 8px 10px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-del-sm:active { background: #dc2626; transform: scale(0.95); }

    .temp-batch-btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn-batch { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px solid transparent; }
    .btn-batch-confirm { background: #065f46; color: #a7f3d0; border-color: #059669; }
    .btn-batch-clear { background: #7f1d1d; color: #fecaca; border-color: #dc2626; }

    /* 아코디언 확정 기록 폴더 */
    .acc-date-group { margin-bottom: 12px; border: 1px solid #475569; border-radius: 8px; overflow: hidden; }
    .acc-date-header { background: #1e293b; padding: 12px; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #475569; }
    .acc-date-body { display: none; background: #0f172a; padding: 10px; }
    .acc-date-body.open { display: block; }
    .acc-event-group { background: #334155; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .acc-event-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #fbbf24; }
    .acc-winner-list { font-size: 14px; color: #cbd5e1; line-height: 1.6; padding-left: 8px; }

    /* Confetti Canvas */
    canvas#confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; }
  </style>
</head>
<body>

  <!-- 메인 상단 헤더 (새로고침 버튼 추가) -->
  <header>
    <button class="btn-icon" id="reloadAppBtn" aria-label="새로고침" title="새로고침" style="font-size: 22px;">🔄</button>
    <div class="header-right">
      <button class="btn-icon" id="openHistoryBtn" aria-label="기록">📋</button>
      <button class="btn-icon" id="openSettingsBtn" aria-label="설정">⚙️</button>
    </div>
  </header>

  <!-- 룰렛 영역 -->
  <div class="wheel-area">
    <div class="pointer"></div>
    <div class="wheel-center-cap"></div>
    <canvas id="wheelCanvas" width="800" height="800"></canvas>
  </div>

  <!-- 컨트롤 버튼 -->
  <div class="control-area">
    <button class="btn-spin" id="spinBtn">돌리기</button>
  </div>

  <!-- 당첨 알림 모달 -->
  <div class="modal-winner" id="winnerModal">
    <div class="winner-card">
      <div class="winner-subtitle">축하합니다! 당첨자</div>
      <div class="winner-name" id="winnerNameDisplay">-</div>
      <button class="btn-confirm" id="confirmWinnerBtn">확인</button>
    </div>
  </div>

  <!-- 1. 설정 패널 모달 -->
  <div class="modal-panel" id="settingsModal">
    <div class="panel-header">
      <button class="btn-nav" id="settingsToWheelBtn">🎡 룰렛</button>
      <h2>룰렛 설정</h2>
      <button class="btn-nav" id="settingsToHistoryBtn">📋 기록</button>
    </div>
    <div class="panel-body">
      <div class="panel-group">
        <div class="panel-title">추첨 방식</div>
        <div class="toggle-wrap">
          <div class="toggle-opt selected" id="modePlanned">순차 당첨</div>
          <div class="toggle-opt" id="modeRandom">랜덤</div>
        </div>
      </div>
      <div class="panel-group">
        <div class="panel-title"><span>인원수 (칸 수)</span><span id="itemCountLabel" style="color:#f59e0b;">8명</span></div>
        <div class="slider-row">
          <span>2</span><input type="range" id="itemCountSlider" min="2" max="20" value="8" /><span>20</span>
        </div>
      </div>
      <div class="panel-group">
        <div class="panel-title">명단 및 당첨 순번</div>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4;">
          개별 항목의 [✕] 버튼으로 삭제하거나, [인원 전체 삭제]로 명단을 일괄 비울 수 있습니다.
        </p>
        <div class="item-list" id="itemList"></div>
        <div class="reset-btn-group">
          <button class="btn-small" id="resetNextOrderBtn">당첨 리셋</button>
          <button class="btn-small" id="clearAllBadgesBtn">순번 해제</button>
          <button class="btn-small" id="clearAllNamesBtn">인원 전체 삭제</button>
        </div>
      </div>
      <div class="panel-group">
        <div class="panel-title"><span>회전 시간</span><span id="spinDurationLabel" style="color:#f59e0b;">3초</span></div>
        <div class="slider-row">
          <span>1초</span><input type="range" id="spinDurationSlider" min="1" max="8" value="3" /><span>8초</span>
        </div>
      </div>
    </div>
    <div class="panel-footer">
      <button class="btn-save" id="saveSettingsBtn">저장하고 닫기</button>
    </div>
  </div>

  <!-- 2. 기록 관리 패널 모달 -->
  <div class="modal-panel" id="historyModal">
    <div class="panel-header">
      <button class="btn-nav" id="historyToWheelBtn">🎡 룰렛</button>
      <h2>당첨 기록 관리</h2>
      <button class="btn-nav" id="historyToSettingsBtn">⚙️ 설정</button>
    </div>
    <div class="panel-body">
      
      <!-- 대기(미확정) 명단 섹션 -->
      <div class="panel-group">
        <div class="panel-title">
          <span>대기 명단 (테스트/실당첨 구분)</span>
        </div>
        <div class="event-input-box">
          <input type="text" id="eventNameInput" placeholder="저장할 이벤트명 (예: 1등 추첨)" />
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">
          실제 당첨자는 <b>[✓ 확정]</b>을 눌러 바로 저장하고, 테스트는 <b>[✕ 삭제]</b>로 버리세요.
        </p>
        
        <!-- 대기 명단 아이템 리스트 -->
        <div id="tempListArea"></div>

        <div class="temp-batch-btns">
          <button class="btn-batch btn-batch-confirm" id="confirmAllTempBtn">대기 명단 모두 확정</button>
          <button class="btn-batch btn-batch-clear" id="clearTempBtn">대기 명단 전체 삭제</button>
        </div>
      </div>

      <!-- 영구 저장된 확정 기록 섹션 -->
      <div class="panel-group">
        <div class="panel-title">
          <span>확정된 기록 목록</span>
          <button id="toggleAllBtn" style="background:none; border:none; color:#f59e0b; font-weight:bold; cursor:pointer;">전체 펼치기</button>
        </div>
        <div id="savedRecordsArea"></div>
        
        <button id="clearAllSavedBtn" style="width:100%; padding:10px; background:transparent; border:1px solid #64748b; color:#94a3b8; border-radius:8px; font-size:12px; margin-top:16px; cursor:pointer;">
          확정 기록 전체 영구 삭제 (초기화)
        </button>
      </div>

    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const PALETTE = ["#ef4444", "#f97316", "#f59e0b", "#10b981", "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", "#ec4899", "#f43f5e", "#14b8a6", "#84cc16", "#eab308", "#a855f7", "#d946ef", "#0284c7", "#059669", "#65a30d", "#ea580c", "#4f46e5"];

    let state = {
      mode: 'planned', count: 8, duration: 3, currentTurnIndex: 1,
      items: Array.from({length: 8}, (_, i) => ({ name: `참가자 ${i+1}`, order: null }))
    };
    
    let tempHistory = [];
    let savedHistory = [];

    const savedData = localStorage.getItem('ROULETTE_DATA');
    if (savedData) try { state = JSON.parse(savedData); } catch(e) {}
    
    const savedTemp = localStorage.getItem('ROULETTE_TEMP');
    if (savedTemp) try { tempHistory = JSON.parse(savedTemp); } catch(e) {}
    
    const savedRecs = localStorage.getItem('ROULETTE_RECORDS');
    if (savedRecs) try { savedHistory = JSON.parse(savedRecs); } catch(e) {}

    function saveState() {
      localStorage.setItem('ROULETTE_DATA', JSON.stringify(state));
      localStorage.setItem('ROULETTE_TEMP', JSON.stringify(tempHistory));
      localStorage.setItem('ROULETTE_RECORDS', JSON.stringify(savedHistory));
    }

    // 날짜 및 요일 포맷 헬퍼 함수
    function getDayOfWeek(dateStr) {
      if (!dateStr) return '';
      const clean = dateStr.slice(0, 10);
      const parts = clean.split('-');
      if (parts.length === 3) {
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        const dt = new Date(y, m, d);
        if (!isNaN(dt.getTime())) {
          const days = ['일', '월', '화', '수', '목', '금', '토'];
          return days[dt.getDay()];
        }
      }
      return '';
    }

    function formatDateWithDay(dateStr) {
      if (!dateStr) return '';
      const clean = dateStr.slice(0, 10);
      const day = getDayOfWeek(clean);
      return day ? `${clean} (${day})` : dateStr;
    }

    // 새로고침 버튼 핸들러: 캐시 스토리지 전체 삭제 및 서비스 워커 강제 갱신 후 리로드
    document.getElementById('reloadAppBtn').onclick = async () => {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let reg of registrations) {
            await reg.update();
          }
        }
      } catch(e) {}
      window.location.reload(true);
    };

    // 오디오 컨텍스트 및 음원 연동
    let audioCtx = null;
    let fanfareAudio = null;
    try {
      fanfareAudio = new Audio('팡파레(빵빠레).01.wav');
    } catch(e) {}

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    // 1. 회전 효과음: 바늘이 각 칸을 지날 때 발생하는 물리적 라쳇 사운드
    function playTickSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.02);
        
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now);
        osc.stop(now + 0.025);
      } catch(e) {}
    }

    // 2. 당첨 축하 팡파레 사운드
    function playFanfareSound() {
      if (fanfareAudio) {
        fanfareAudio.currentTime = 0;
        fanfareAudio.play().catch(() => playSynthFanfare());
      } else {
        playSynthFanfare();
      }
    }

    function playSynthFanfare() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      function playNote(freq, time, dur, type, vol) {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, time);

      let targetIndex = -1;
      if (state.mode === 'planned') {
        targetIndex = state.items.findIndex(it => it && it.order === state.currentTurnIndex);
        if (targetIndex === -1) {
          const assigned = state.items.map((it, idx) => ({ ...it, idx })).filter(it => it.order !== null).sort((a, b) => a.order - b.order);
          if (assigned.length > 0) { targetIndex = assigned[0].idx; state.currentTurnIndex = assigned[0].order; } 
          else { targetIndex = Math.floor(Math.random() * num); }
        }
      } else { targetIndex = Math.floor(Math.random() * num); }

      const targetAngle = targetIndex * arc + arc / 2; const topAngle = (3 * Math.PI) / 2;
      let diff = (topAngle - targetAngle - (currentAngle % (2 * Math.PI))) % (2 * Math.PI); if (diff < 0) diff += 2 * Math.PI;
      const totalRotation = (2 * Math.PI * 7) + diff;
      const startAngle = currentAngle; const finalAngle = startAngle + totalRotation;
      const durationMs = state.duration * 1000; let startTime = null;

      let lastSector = Math.floor(currentAngle / arc);

      isSpinning = true; document.getElementById('spinBtn').disabled = true;

      function animate(time) {
        if (!startTime) startTime = time; const prog = Math.min((time - startTime) / durationMs, 1);
        currentAngle = startAngle + totalRotation * (1 - Math.pow(1 - prog, 4));

        const currentSector = Math.floor(currentAngle / arc);

    function startConfetti() {
      const w = confettiCanvas.width;
      const h = confettiCanvas.height;
      const particleCount = 220;

      confettiParticles = Array.from({ length: particleCount }, () => {
        const isLeft = Math.random() < 0.5;
        return {
          x: isLeft ? w * 0.2 + (Math.random() * w * 0.1) : w * 0.8 - (Math.random() * w * 0.1),
          y: h * 0.65,
          w: Math.random() * 8 + 6,
          h: Math.random() * 14 + 8,
          color: NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)],
          vx: (isLeft ? 1 : -1) * (Math.random() * 9 + 4) + (Math.random() - 0.5) * 8,
          vy: -(Math.random() * 18 + 13),
          gravity: 0.42,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          tiltAngle: Math.random() * Math.PI,
          tiltSpeed: Math.random() * 0.12 + 0.05,
          opacity: 1
        };
      });

      const startTime = performance.now();
      const maxDuration = 4500;

      function render(now) {
        cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        const elapsed = now - startTime;
        let alive = false;

        confettiParticles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= 0.98;
          p.rotation += p.rotSpeed; p.tiltAngle += p.tiltSpeed;

          if (elapsed > maxDuration - 600) {
            p.opacity = Math.max(0, (maxDuration - elapsed) / 600);
          }

          if (p.y < confettiCanvas.height + 50 && p.opacity > 0) {
            alive = true;
            cCtx.save();
            cCtx.translate(p.x, p.y);
            cCtx.rotate((p.rotation * Math.PI) / 180);
            cCtx.scale(1, Math.cos(p.tiltAngle));
            cCtx.fillStyle = p.color;
            cCtx.globalAlpha = p.opacity;
            cCtx.shadowColor = p.color;
            cCtx.shadowBlur = 4;
            cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            cCtx.restore();
          }
        });

        if (alive && elapsed < maxDuration) {
          confettiAnim = requestAnimationFrame(render);
        } else {
          cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
      }

      cancelAnimationFrame(confettiAnim);
      confettiAnim = requestAnimationFrame(render);
    }

    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }

    drawWheel();
  </script>
